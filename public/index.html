<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIELIT Boys Hostel – Warden Portal</title><meta name="theme-color" content="#0f3d3e"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fff;--tx:#17302f;--mu:#5d7170;--bd:#d6dfdb;--ink:#0f3d3e;--pr:#0f3d3e;--lk:#17595a;--sel:#e3ede9;--ok:#2e7d5b;--okb:#dff1e8;--wa:#a35f00;--wab:#fdebc8;--no:#b3261e;--nob:#fbdcd9;--r:12px}
@media(prefers-color-scheme:dark){:root{--bg:#0c1514;--card:#142220;--tx:#e4efec;--mu:#8fa8a4;--bd:#243a36;--ink:#0b2a2b;--pr:#2c7f80;--lk:#6fd0d1;--sel:#1b312e;--ok:#5fd0a0;--okb:#173a2b;--wa:#f2b24d;--wab:#3d2d0c;--no:#ff8a80;--nob:#3f1816}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 'Atkinson Hyperlegible',system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:76px}
.hide{display:none!important}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20;min-height:58px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:36px;height:36px;border-radius:10px;background:#ffffff22;display:grid;place-items:center;font:800 17px 'Bricolage Grotesque',sans-serif}
header h1{font:700 17px/1.1 'Bricolage Grotesque',sans-serif;margin:0}header small{display:block;font-size:12px;opacity:.8;margin-top:3px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);z-index:15;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--mu);padding:8px 0 7px;font-size:10.5px}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--lk);font-weight:700;box-shadow:inset 0 3px 0 var(--lk)}
main{max-width:1100px;margin:auto;padding:14px}
@media(min-width:900px){body{padding-bottom:0}nav{top:58px;bottom:0;right:auto;width:196px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--bd);padding:14px 10px;gap:2px}nav button{flex:none;flex-direction:row;gap:12px;font-size:14px;padding:10px 12px;border-radius:10px}nav button.on{background:var(--sel);box-shadow:none}main{max-width:none;margin:0 0 0 196px;padding:22px 28px}main>*{max-width:1040px}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card>b:first-child{font:700 16px 'Bricolage Grotesque',sans-serif}
.hero{background:var(--ink);color:#fff;border:0;padding:18px 18px 20px}.hero .dt{font-size:13px;opacity:.75}.hnum{font-size:16px;margin-top:6px}.hnum span{font:800 46px/1 'Bricolage Grotesque',sans-serif;margin-right:8px}
.hero .mu{color:#ffffffb8;margin-top:4px}.pbar{height:8px;border-radius:99px;background:#ffffff2e;margin-top:14px;overflow:hidden}.pbar i{display:block;height:100%;background:#7fe0b0;border-radius:99px}
input,select,textarea{font:inherit;min-height:42px;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--card);color:var(--tx);max-width:100%}textarea{width:100%;min-height:70px}
button{font:inherit;cursor:pointer}input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--lk);outline-offset:1px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:9px;min-height:42px;padding:8px 16px;font-weight:700}.btn.sm{min-height:34px;padding:4px 11px;font-size:13px}
.btn.ghost{background:transparent;color:var(--lk);border:1px solid var(--bd)}.btn.ok{background:var(--okb);color:var(--ok);border:1px solid var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row>*{flex:1;min-width:130px}.row>.btn.sm{flex:none}
.tbl{overflow:auto;max-height:68vh}table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:700;font-size:12.5px;color:var(--mu);text-align:left;background:var(--card);position:sticky;top:0;z-index:2}
th,td{padding:9px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}tbody tr:hover td,tr:hover>td{background:var(--sel)}
.grid td:nth-child(n+3),.grid th:nth-child(n+3){text-align:center;padding:8px 5px;min-width:30px}
.grid td:nth-child(-n+2),.grid th:nth-child(-n+2){position:sticky;left:0;background:var(--card);z-index:1}.grid th:nth-child(-n+2){z-index:3}.grid td:nth-child(1),.grid th:nth-child(1){min-width:62px}.grid td:nth-child(2),.grid th:nth-child(2){left:62px;box-shadow:2px 0 0 var(--bd)}
.cL{background:var(--wab);color:var(--wa);font-weight:700}.cA{background:var(--nob);color:var(--no);font-weight:700}.red{color:var(--no);font-weight:700}
.tag{display:inline-flex;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:700}.tag.In{background:var(--okb);color:var(--ok)}.tag.Leave{background:var(--wab);color:var(--wa)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.chip{padding:4px 12px;border-radius:99px;font-weight:700;font-size:13px;background:var(--sel)}.chip.P{background:var(--okb);color:var(--ok)}.chip.L{background:var(--wab);color:var(--wa)}.chip.A{background:var(--nob);color:var(--no)}
.bar{position:sticky;top:58px;z-index:10;padding:12px 14px}.bar .row{margin:0}
.list{display:flex;flex-direction:column}.item{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.room{min-width:54px;text-align:center;padding:6px;border-radius:8px;background:var(--sel);font:700 13px 'Bricolage Grotesque',sans-serif}.nm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:600}.act{display:flex;gap:8px;align-items:center}
@media(max-width:560px){.item{grid-template-columns:auto 1fr}.act{grid-column:2}}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--mu);min-width:44px;min-height:38px;font-weight:800}.seg button+button{border-left:1px solid var(--bd)}
.seg .P.on{background:var(--okb);color:var(--ok);box-shadow:inset 0 0 0 2px var(--ok)}.seg .L.on{background:var(--wab);color:var(--wa);box-shadow:inset 0 0 0 2px var(--wa)}.seg .A.on{background:var(--nob);color:var(--no);box-shadow:inset 0 0 0 2px var(--no)}
img.av{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;background:var(--sel);flex:none}.mu{color:var(--mu);font-size:13px}a{color:var(--lk);font-weight:600}.empty{color:var(--mu);padding:18px 4px;text-align:center}hr{border:0;border-top:1px solid var(--bd);margin:16px 0}
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--ink)}.lcard{background:var(--card);border-radius:16px;padding:26px 22px;width:100%;max-width:360px}.lcard .logo{background:var(--ink);color:#fff;width:46px;height:46px;font-size:21px;margin-bottom:14px}.lcard h2{font:800 24px/1.1 'Bricolage Grotesque',sans-serif;margin:0}.lcard p{color:var(--mu);margin:6px 0 18px}.lcard input,.lcard .btn{width:100%;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:50;font-weight:700}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:900px){.toast{bottom:30px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="login" class="hide"><div class="lcard"><div class="logo">N</div><h2>NIELIT Boys Hostel</h2><p>Gorakhpur Campus. Warden sign-in.</p><input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="btn" onclick="login()">Sign in</button></div></div>
<div id="app" class="hide">
<header><div class="brand"><div class="logo">N</div><div><h1>NIELIT Boys Hostel</h1><small>Gorakhpur Campus, warden portal</small></div></div><button class="btn ghost sm" style="color:#fff;border-color:#ffffff55" onclick="logout()">Log out</button></header>
<main id="main"></main><nav id="nav"></nav><div id="toast" class="toast"></div></div>
<script>
const $=s=>document.querySelector(s),TABS=[['dash','Home'],['att','Today'],['sheet','Sheet'],['leave','Leave'],['stu','Students'],['comp','Issues'],['fee','Fees']];
const ICON={dash:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',att:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',sheet:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',leave:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 13h6M9 17h6"/>',stu:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.5.7 4 2.5 4 6"/>',comp:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/>',fee:'<path d="M7 4h11M7 9h11M7 4c6 0 8 2 8 5s-2 5-8 5l7 6"/>'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(window.TT);window.TT=setTimeout(()=>t.classList.remove('show'),1800)}
let S=[],tab='dash',F={batch:'',branch:'',q:''},M={},CH={};
const tok=()=>localStorage.getItem('tok')||'',up=f=>f?'/api/img/'+f+'?t='+encodeURIComponent(tok()):'';
const today=()=>new Date(Date.now()+19800000).toISOString().slice(0,10);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(u,o={}){o.headers={Authorization:'Bearer '+tok()};if(o.body&&!(o.body instanceof FormData)){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}let r;try{r=await fetch(u,o)}catch(e){alert('Server not reachable');throw 0}if(r.status===401){showLogin();throw 0}const j=await r.json().catch(()=>({}));if(!r.ok){alert(j.error||'Error');throw 0}return j}
async function login(){let r;try{r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})})}catch(e){return alert('Server not reachable')}const j=await r.json().catch(()=>({}));if(r.ok){localStorage.setItem('tok',j.token);init()}else alert(j.error||'Login failed')}
function logout(){localStorage.removeItem('tok');showLogin()}
function showLogin(){$('#login').classList.remove('hide');$('#app').classList.add('hide')}
async function init(){$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#nav').innerHTML=TABS.map(t=>`<button id="n_${t[0]}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24">${ICON[t[0]]}</svg><span>${t[1]}</span></button>`).join('');await go('dash')}
async function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='n_'+t));S=await api('/api/students');await V[t]()}
const cmp=(a,b)=>(a.room||'~').localeCompare(b.room||'~',undefined,{numeric:true})||a.name.localeCompare(b.name);
const filt=()=>S.filter(s=>(!F.batch||s.batch==F.batch)&&(!F.branch||s.branch==F.branch)&&(!F.q||(s.name+s.roll+(s.room||'')).toLowerCase().includes(F.q.toLowerCase()))).sort(cmp);
const noRoll=s=>s.roll.startsWith('TMP-'),rl=s=>noRoll(s)?'<span class="tag Leave">no roll</span>':s.roll;
const sName=r=>{const s=S.find(x=>x.roll==r);return s?E(s.name):r},sRoom=r=>{const s=S.find(x=>x.roll==r);return(s&&s.room)||'-'};
const opts=(sel='')=>S.slice().sort(cmp).map(s=>`<option value="${s.roll}" ${s.roll==sel?'selected':''}>${E(s.room||'-')} · ${E(s.name)}${noRoll(s)?'':' ('+s.roll+')'}</option>`).join('');
const covers=(l,d)=>l.from<=d&&(l.returned?d<l.returned:(!l.to||d<=l.to));
const av=s=>s.photo?`<img class="av" src="${up(s.photo)}">`:`<img class="av" alt="">`;
const filterBar=()=>`<div class="row"><select onchange="F.batch=this.value;V[tab](1)"><option value="">All batches</option><option ${F.batch=='2025-2029'?'selected':''}>2025-2029</option><option ${F.batch=='2026-2030'?'selected':''}>2026-2030</option></select><select onchange="F.branch=this.value;V[tab](1)"><option value="">All branches</option><option ${F.branch=='CSE'?'selected':''}>CSE</option><option ${F.branch=='ECE'?'selected':''}>ECE</option></select><input placeholder="Search name / roll / room" value="${E(F.q)}" onchange="F.q=this.value;V[tab](1)"></div>`;
function csv(name,rows){const c=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+c],{type:'text/csv'}));a.download=name;a.click()}
const parseCSV=t=>{const r=[];let row=[],f='',q=0;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'&&t[i+1]=='"'){f+='"';i++}else if(c=='"')q=0;else f+=c}else if(c=='"')q=1;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);r.push(row);row=[];f=''}else if(c!='\r')f+=c}row.push(f);r.push(row);return r};
const V={
async dash(){const l=await api('/api/leaves'),on=l.filter(x=>x.status=='On Leave').sort((a,b)=>sRoom(a.roll).localeCompare(sRoom(b.roll),undefined,{numeric:true}));
$('#main').innerHTML=`<div class="card hero"><div class="dt">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</div><div class="hnum"><span>${S.length-on.length}</span>in hostel today</div><div class="mu">${on.length} on leave, ${S.length} students in total</div><div class="pbar"><i style="width:${S.length?Math.round((S.length-on.length)/S.length*100):0}%"></i></div></div><div class="card"><b>Students on leave</b><div class="tbl"><table><tr><th>Room</th><th>Name</th><th>From</th><th>To</th><th>Reason</th><th>App</th><th></th></tr>${on.map(x=>`<tr><td>${sRoom(x.roll)}</td><td>${sName(x.roll)}</td><td>${x.from}</td><td>${x.to||'-'}</td><td style="white-space:normal">${E(x.reason)}</td><td><a target=_blank href="${up(x.image)}">view</a></td><td><button class="btn sm ok" onclick="ret('${x.id}')">Returned</button></td></tr>`).join('')||'<tr><td colspan=7 class=mu>Everyone is in hostel 🎉</td></tr>'}</table></div></div>`},
async att(keep){const d=window.AD||today();if(!keep){M=(await api('/api/attendance?date='+d)).marks;CH={}}const R=filt();window.AR=R;
$('#main').innerHTML=`<div class="card bar"><div class="row"><input type="date" value="${d}" onchange="window.AD=this.value;V.att()"><button class="btn" onclick="saveAtt()">Save changes</button></div><div class="chips" id="cnt"></div></div><div class="card">${filterBar()}<div class="row"><button class="btn ghost sm" onclick="dlDay()">Download this day (CSV)</button></div><p class="mu">Everyone is Present by default. Students with a leave record show L automatically. Change only the exceptions.</p>${R.length?`<div class="list">${R.map(s=>{const v=M[s.roll]||'P';return`<div class="item"><span class="room">${E(s.room||'-')}</span><span class="nm">${av(s)} ${E(s.name)}</span><div class="act"><div class="seg" id="g_${s.roll}">${[['P','Present'],['L','Leave'],['A','Absent']].map(o=>`<button class="${o[0]}${v==o[0]?' on':''}" onclick="mk('${s.roll}','${o[0]}')" aria-label="${o[1]}">${o[0]}</button>`).join('')}</div><button class="btn ghost sm" onclick="quickLeave('${s.roll}')">Add leave</button></div></div>`}).join('')}</div>`:'<p class="empty">No students found. Add them from the Students tab or import your sheet.</p>'}</div>`;cnt()},
async sheet(){const mo=window.MO||today().slice(0,7),[y,m]=mo.split('-').map(Number),n=new Date(y,m,0).getDate(),[lv,A]=await Promise.all([api('/api/leaves'),api('/api/attendance/all')]),t=today(),ds=[...Array(n)].map((_,i)=>mo+'-'+String(i+1).padStart(2,'0'));
const cell=(s,d)=>d>t?'':((A[d]||{})[s.roll]||(lv.some(l=>l.roll==s.roll&&covers(l,d))?'L':'P'));
const R=filt().map(s=>({s,c:ds.map(d=>cell(s,d))}));window.SH={ds,R};
$('#main').innerHTML=`<div class="card"><div class="row"><input type="month" value="${mo}" onchange="window.MO=this.value;V.sheet()"><button class="btn sm" onclick="dlSheet()">⬇ Month CSV</button></div>${filterBar()}<p class="mu">Blank = Present (default). <span class="red">L</span> = leave (from leave records), <span class="red">A</span> = absent.</p><div class="tbl"><table class="grid"><tr><th>Room</th><th>Name</th>${ds.map((d,i)=>`<th>${i+1}</th>`).join('')}<th>Leave days</th></tr>${R.map(r=>`<tr><td>${E(r.s.room||'-')}</td><td>${E(r.s.name)}</td>${r.c.map(v=>`<td class="${v=='L'?'cL':v=='A'?'cA':''}">${v=='L'||v=='A'?v:''}</td>`).join('')}<td>${r.c.filter(v=>v=='L').length}</td></tr>`).join('')}</table></div></div>`},
async leave(){const l=await api('/api/leaves'),sel=window.LR||'';window.LR='';$('#main').innerHTML=`<div class="card"><b>New leave</b><div class="row" style="margin-top:8px"><select id="lr">${opts(sel)}</select><input id="lf" type="date" value="${today()}"><input id="lt" type="date" title="To (optional)"></div><textarea id="lx" rows=2 placeholder="Short reason"></textarea><p class="mu">Application photo (mandatory) – on phone this opens the camera:</p><input id="li" type="file" accept="image/*" capture="environment"><br><br><button class="btn" onclick="addLeave()">Save leave</button></div><div class="card tbl"><table><tr><th>Room</th><th>Name</th><th>From</th><th>To</th><th>Reason</th><th>Status</th><th>App</th><th></th></tr>${l.map(x=>`<tr><td>${sRoom(x.roll)}</td><td>${sName(x.roll)}</td><td>${x.from}</td><td>${x.to||'-'}</td><td style="white-space:normal">${E(x.reason)}</td><td><span class="tag ${x.status=='On Leave'?'Leave':'In'}">${x.status}${x.returned?' '+x.returned:''}</span></td><td><a target=_blank href="${up(x.image)}">view</a></td><td>${x.status=='On Leave'?`<button class="btn sm ok" onclick="ret('${x.id}')">Returned</button>`:''}</td></tr>`).join('')}</table></div>`},
async stu(){$('#main').innerHTML=`<div class="card"><b>Add / update student</b><input id="so" type="hidden"><div class="row" style="margin-top:8px"><input id="srm" placeholder="Room no. (A-01)"><input id="sn" placeholder="Name"><input id="sr" placeholder="Roll number (blank = temporary)"></div><div class="row"><select id="sb"><option value="">Batch (auto)</option><option>2025-2029</option><option>2026-2030</option></select><select id="sbr"><option value="">Branch?</option><option>CSE</option><option>ECE</option></select><input id="sm" placeholder="Student mobile" inputmode="tel"><input id="sp" placeholder="Parent mobile" inputmode="tel"></div><p class="mu">Photo (camera on phone):</p><input id="sf" type="file" accept="image/*" capture="user"><br><br><button class="btn" onclick="addStu()">Save student</button>
<hr><b>Import from your sheet (CSV)</b><p class="mu">Google Sheet → File → Download → CSV. Columns used: Room No., Name, NDU Roll Number, Contact No., Contact No. (Sec.) and optional Batch / Branch. Missing roll → temporary roll, fix later with Edit.</p><div class="row"><select id="ib"><option value="">Batch: from roll no.</option><option>2025-2029</option><option>2026-2030</option></select><select id="ibr"><option value="">Branch: not set</option><option>CSE</option><option>ECE</option></select></div><input type="file" id="cf" accept=".csv" onchange="impCsv(this)"></div>
<div class="card">${filterBar()}<button class="btn sm" onclick="dlStu()">⬇ Download list</button><div class="tbl"><table><tr><th>Room</th><th>Name</th><th>Roll</th><th>Batch</th><th>Br</th><th>Mobile</th><th>Parent</th><th>Status</th><th></th></tr>${filt().map(s=>`<tr><td>${E(s.room||'-')}</td><td>${av(s)} ${E(s.name)}</td><td>${rl(s)}</td><td>${s.batch||''}</td><td>${s.branch||''}</td><td><a href="tel:${s.mobile}">${s.mobile||''}</a></td><td><a href="tel:${s.parentMobile}">${s.parentMobile||''}</a></td><td><span class="tag ${s.status=='On Leave'?'Leave':'In'}">${s.status}</span></td><td><button class="btn sm" onclick="edit('${s.roll}')">Edit</button> <button class="btn sm" onclick="quickLeave('${s.roll}')">Add leave</button></td></tr>`).join('')}</table></div></div>`},
async comp(){const c=await api('/api/complaints');$('#main').innerHTML=`<div class="card"><b>New complaint</b><div class="row" style="margin-top:8px"><select id="cr">${opts()}</select></div><textarea id="ct" rows=3 placeholder="Complaint details"></textarea><br><br><button class="btn" onclick="addComp()">Add complaint</button></div><div class="card tbl"><table><tr><th>Date</th><th>Room</th><th>Name</th><th>Complaint</th><th>Status</th></tr>${c.map(x=>`<tr><td>${x.date}</td><td>${sRoom(x.roll)}</td><td>${sName(x.roll)}</td><td style="white-space:normal">${E(x.text)}</td><td><select onchange="setComp('${x.id}',this.value)">${['Open','In Progress','Resolved'].map(s=>`<option ${x.status==s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table></div>`},
async fee(){const f=await api('/api/fees'),sem=window.SEM||1,fm={};f.filter(x=>x.sem==sem).forEach(x=>fm[x.roll]=x);
$('#main').innerHTML=`<div class="card"><div class="row"><select onchange="window.SEM=+this.value;V.fee()">${[1,2,3,4,5,6,7,8].map(n=>`<option value=${n} ${n==sem?'selected':''}>Semester ${n}</option>`).join('')}</select><button class="btn sm" onclick="dlFee()">⬇ CSV</button></div>${filterBar()}<div class="tbl"><table><tr><th>Room</th><th>Name</th><th>Paid?</th><th>Receipt no.</th><th>Date</th><th>Amount</th><th></th></tr>${filt().map(s=>{const x=fm[s.roll];return`<tr><td>${E(s.room||'-')}</td><td>${E(s.name)}</td><td><input type="checkbox" id="p_${s.roll}" ${x?'checked':''}></td><td><input id="r_${s.roll}" value="${x?E(x.receipt):''}" size=10></td><td><input type="date" id="d_${s.roll}" value="${x?x.date:''}"></td><td><input id="a_${s.roll}" value="${x?E(x.amount):''}" size=6></td><td><button class="btn sm" onclick="saveFee('${s.roll}')">Save</button></td></tr>`}).join('')}</table></div></div>`}};
async function saveAtt(){await api('/api/attendance',{method:'POST',body:{date:window.AD||today(),marks:CH}});CH={};cnt();toast('Attendance saved')}
function cnt(){const R=window.AR||[],c=x=>R.filter(s=>(M[s.roll]||'P')==x).length,n=Object.keys(CH).length;$('#cnt').innerHTML=`<span class="chip P">Present ${c('P')}</span><span class="chip L">Leave ${c('L')}</span><span class="chip A">Absent ${c('A')}</span>${n?`<span class="chip">${n} unsaved</span>`:''}`}
function mk(r,v){M[r]=CH[r]=v;document.querySelectorAll('#g_'+r+' button').forEach(b=>b.classList.toggle('on',b.classList.contains(v)));cnt()}
function dlDay(){const d=window.AD||today();csv(`attendance-${d}.csv`,[['Room','Name','Roll','Batch','Branch','Mark'],...filt().map(s=>[s.room,s.name,noRoll(s)?'':s.roll,s.batch,s.branch,M[s.roll]||'P'])])}
function dlSheet(){const{ds,R}=SH;csv('hostel-sheet-'+ds[0].slice(0,7)+'.csv',[['Room','Name','Roll','Batch','Branch',...ds,'Present','Leave','Absent'],...R.map(r=>[r.s.room,r.s.name,noRoll(r.s)?'':r.s.roll,r.s.batch,r.s.branch,...r.c,...['P','L','A'].map(x=>r.c.filter(v=>v==x).length)])])}
const shrink=f=>new Promise((ok,no)=>{const i=new Image;i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.6))};i.onerror=()=>{alert('Could not read image');no()};i.src=URL.createObjectURL(f)});
function quickLeave(r){window.LR=r;go('leave')}
async function addLeave(){const f=$('#li').files[0];if(!f)return alert('Application image is mandatory');const image=await shrink(f);await api('/api/leaves',{method:'POST',body:{roll:$('#lr').value,from:$('#lf').value,to:$('#lt').value,reason:$('#lx').value,image}});V.leave()}
async function ret(id){await api('/api/leaves/'+id+'/return',{method:'POST',body:{}});go(tab)}
async function addStu(){const b={oldRoll:$('#so').value};[['roll','sr'],['name','sn'],['batch','sb'],['branch','sbr'],['mobile','sm'],['parentMobile','sp'],['room','srm']].forEach(([k,i])=>b[k]=$('#'+i).value);if($('#sf').files[0])b.photo=await shrink($('#sf').files[0]);await api('/api/students',{method:'POST',body:b});go('stu')}
function edit(r){const s=S.find(x=>x.roll==r);$('#so').value=s.roll;$('#sr').value=noRoll(s)?'':s.roll;$('#sn').value=s.name;$('#sb').value=s.batch||'';$('#sbr').value=s.branch||'';$('#sm').value=s.mobile||'';$('#sp').value=s.parentMobile||'';$('#srm').value=s.room||'';scrollTo(0,0)}
async function impCsv(el){const R=parseCSV(await el.files[0].text()),hi=R.findIndex(r=>r.some(c=>/^name$/i.test(c.trim()))&&r.some(c=>/room|roll/i.test(c)));if(hi<0)return alert('Header row with Name and Room/Roll not found');const H=R[hi].map(c=>c.trim()),ix=re=>H.findIndex(c=>re.test(c)),c={room:ix(/room/i),name:ix(/^name$/i),roll:ix(/roll/i),mobile:ix(/^(contact no\.?|mobile|phone)$/i),parent:ix(/sec|parent/i),batch:ix(/batch/i),branch:ix(/branch/i)},g=(r,k)=>c[k]<0?'':(r[c[k]]||'').trim();
const rows=R.slice(hi+1).filter(r=>g(r,'name')).map(r=>({room:g(r,'room'),name:g(r,'name'),roll:g(r,'roll'),mobile:g(r,'mobile'),parentMobile:g(r,'parent'),batch:g(r,'batch')||$('#ib').value,branch:g(r,'branch')||$('#ibr').value}));
const j=await api('/api/students/import',{method:'POST',body:{rows}});alert(j.imported+' students imported');go('stu')}
function dlStu(){csv('students.csv',[['Room','Name','Roll','Batch','Branch','Mobile','Parent Mobile','Status'],...filt().map(s=>[s.room,s.name,noRoll(s)?'':s.roll,s.batch,s.branch,s.mobile,s.parentMobile,s.status])])}
async function addComp(){await api('/api/complaints',{method:'POST',body:{roll:$('#cr').value,text:$('#ct').value}});V.comp()}
async function setComp(id,status){await api('/api/complaints/'+id,{method:'POST',body:{status}})}
async function saveFee(r){await api('/api/fees',{method:'POST',body:{roll:r,sem:window.SEM||1,paid:$('#p_'+r).checked,receipt:$('#r_'+r).value,date:$('#d_'+r).value,amount:$('#a_'+r).value}});toast('Saved')}
async function dlFee(){const f=await api('/api/fees'),sem=window.SEM||1,m={};f.filter(x=>x.sem==sem).forEach(x=>m[x.roll]=x);csv(`fee-sem${sem}.csv`,[['Room','Name','Roll','Paid','Receipt','Date','Amount'],...filt().map(s=>[s.room,s.name,noRoll(s)?'':s.roll,m[s.roll]?'Yes':'No',m[s.roll]?.receipt,m[s.roll]?.date,m[s.roll]?.amount])])}
tok()?init().catch(()=>{}):showLogin();
